spring.application.name=task-management-portal

server.port=8080

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/taskportal
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# AI API Keys
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}
openrouter.api.key=${OPENROUTER_API_KEY:YOUR_OPENROUTER_API_KEY}

logging.level.com.taskportal=DEBUG
logging.level.org.springframework.security=DEBUG

spring.main.banner-mode=console
spring.jpa.open-in-view=false
